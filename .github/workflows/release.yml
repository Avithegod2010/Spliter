name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build APK and attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release APK (local EAS build on runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build -p android --profile production --local --non-interactive --output "./Spliter-${{ github.ref_name }}.apk"

      - name: Attach APK to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "./Spliter-${{ github.ref_name }}.apk"
          generate_release_notes: true
