<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spliter banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <!-- split-file motif: one document breaking into three numbered parts -->
  <g transform="translate(105 78)">
    <rect x="0" y="0" width="120" height="144" rx="14" fill="url(#glass)" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M 84 0 h 36 v 36 z" fill="#A78BFA" fill-opacity="0.85"/>
    <g fill="#FFFFFF" fill-opacity="0.55">
      <rect x="18" y="52" width="84" height="9" rx="4.5"/>
      <rect x="18" y="74" width="66" height="9" rx="4.5"/>
      <rect x="18" y="96" width="76" height="9" rx="4.5"/>
    </g>
    <!-- split line -->
    <line x1="60" y1="-12" x2="60" y2="156" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="8 7"/>
    <circle cx="60" cy="-16" r="7" fill="#8B5CF6"/>
    <!-- arrows to parts -->
    <path d="M 128 34 L 178 34 M 170 27 L 179 34 L 170 41" stroke="#67E8F9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 128 72 L 178 72 M 170 65 L 179 72 L 170 79" stroke="#34D399" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 128 110 L 178 110 M 170 103 L 179 110 L 170 117" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- part chips -->
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700" text-anchor="middle">
      <rect x="192" y="18" width="118" height="34" rx="10" fill="rgba(103,232,249,0.12)" stroke="#67E8F9" stroke-opacity="0.5"/>
      <text x="251" y="41" font-size="19" fill="#67E8F9">movie.mp4.001</text>
      <rect x="192" y="55" width="118" height="34" rx="10" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="251" y="78" font-size="19" fill="#34D399">movie.mp4.002</text>
      <rect x="192" y="92" width="118" height="34" rx="10" fill="rgba(251,191,36,0.12)" stroke="#FBBF24" stroke-opacity="0.5"/>
      <text x="251" y="115" font-size="19" fill="#FBBF24">movie.mp4.003</text>
    </g>
    <!-- rejoin arrow -->
    <path d="M 322 72 L 352 72 M 344 64 L 353 72 L 344 80" stroke="#A78BFA" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="368" y="34" width="104" height="78" rx="14" fill="url(#accent)"/>
    <g fill="#FFFFFF">
      <rect x="392" y="52" width="56" height="10" rx="5" fill-opacity="0.95"/>
      <rect x="392" y="72" width="42" height="10" rx="5" fill-opacity="0.75"/>
      <rect x="392" y="92" width="50" height="10" rx="5" fill-opacity="0.75"/>
    </g>
    <text x="420" y="132" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#A78BFA" text-anchor="middle">byte-perfect ✓</text>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="560" y="132" font-size="72" font-weight="800" fill="#F4F4F8" letter-spacing="-2">SPLI<tspan fill="url(#accent)">TER</tspan></text>
    <text x="564" y="176" font-size="22" fill="#A8A8BC">Split any file into byte-perfect parts. Rejoin anywhere.</text>
    <text x="564" y="212" font-size="16" fill="#62627A">No format limits · SHA-256 verified rejoins · Rebuilds on any PC with one shell command</text>
    <text x="564" y="248" font-size="15" fill="#62627A">Expo SDK 58 · React Native · Kotlin streaming IO over SAF</text>
  </g>

  <!-- bottom accent line -->
  <rect x="24" y="282" width="1152" height="4" rx="2" fill="url(#accent)"/>
</svg>
